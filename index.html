<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outbreak — Zombies &amp; Deathmatch</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="hud" class="hidden">
      <div id="crosshair"><span></span><span></span><span></span><span></span></div>

      <div id="hud-left">
        <div id="health-wrap"><div id="health-bar"></div></div>
        <div id="health-text">100</div>
      </div>

      <div id="hud-right">
        <div id="weapon-name">M4</div>
        <div id="ammo"><span id="mag">30</span><span id="reserve">/ 180</span></div>
        <div id="reloading" class="hidden">RELOADING</div>
        <div id="equip-line"></div>
      </div>

      <div id="hud-top"></div>
      <div id="scoreboard" class="hidden"></div>
      <div id="killfeed"></div>
      <div id="loadout-bar"></div>
      <div id="toast"></div>
      <div id="banner"></div>
      <div id="respawning" class="hidden">
        <div class="big">ELIMINATED</div>
        <div class="small-txt">Respawning in <span id="respawn-in">3</span></div>
      </div>
    </div>

    <!-- ══ LOBBY ══════════════════════════════════════════════ -->
    <div id="lobby" class="hidden">
      <header id="lobby-top">
        <div class="player-card">
          <div class="avatar"></div>
          <div class="who">
            <span class="tag">OPERATOR</span>
            <span class="pname">RECRUIT</span>
          </div>
        </div>
        <nav id="tabs"></nav>
        <div class="lobby-stats">
          <span id="stat-kills">0 <i>KILLS</i></span>
          <span id="stat-best">0 <i>BEST WAVE</i></span>
        </div>
      </header>

      <aside id="lobby-left"></aside>
      <aside id="lobby-right"></aside>
      <footer id="lobby-foot">
        <span>OUTBREAK — prototype build</span>
      </footer>
    </div>

    <div id="pause" class="overlay hidden">
      <div class="panel">
        <h1 class="small">PAUSED</h1>
        <div class="nav column">
          <button id="resume-btn">RESUME</button>
          <button class="ghost" id="change-loadout-btn">CHANGE LOADOUT</button>
          <button class="ghost" id="quit-btn">QUIT TO LOBBY</button>
        </div>
      </div>
    </div>

    <div id="result" class="overlay hidden">
      <div class="panel">
        <h1 class="small" id="result-title">YOU DIED</h1>
        <p class="sub" id="result-sub"></p>
        <div id="result-body"></div>
        <div class="nav">
          <button id="again-btn">PLAY AGAIN</button>
          <button class="ghost" id="menu-btn">LOBBY</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
